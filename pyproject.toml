[project]
name = "ai-quant-trading-platform"
version = "0.1.0"
description = "AI Quantitative Trading Platform - Professional algorithmic trading system"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    
    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",
    
    # Redis
    "redis[hiredis]>=5.1.0",
    
    # Quant / Data
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.8.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "ta-lib>=0.5.1;platform_system!='Windows'",
    
    # ML
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    
    # NLP
    "transformers>=4.45.0",
    "torch>=2.4.0",
    
    # Broker
    "alpaca-py>=0.32.0",
    
    # Monitoring / Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    
    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "croniter>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
    "faker>=28.0.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "services*", "strategies*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
